name: SPACE BAR V82 Offline Menu
on:
  push:
    paths:
      - 'agents/offline_menu_v82.py'
      - 'agents/test_v82_offline_menu.py'
      - '.github/workflows/test_v82_offline_menu.yml'
  pull_request:
    paths:
      - 'agents/offline_menu_v82.py'
      - 'agents/test_v82_offline_menu.py'
      - '.github/workflows/test_v82_offline_menu.yml'
  workflow_dispatch:
jobs:
  offline-menu:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v82_offline_menu.py' -v
      - run: python agents/offline_menu_v82.py --once 3 --json
      - run: python agents/offline_menu_v82.py --once 0
