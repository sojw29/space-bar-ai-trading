name: SPACE BAR V216 Regime Window Dispersion
on:
  push:
    paths:
      - 'agents/regime_window_dispersion_v216.py'
      - 'agents/regime_strategy_metrics_v212.py'
      - 'agents/publish_scorecard_v203.py'
      - 'agents/test_v216_regime_window_dispersion.py'
      - '.github/workflows/test_v216_regime_window_dispersion.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regime-window-dispersion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v216_regime_window_dispersion.py' -v
