name: SPACE BAR V311 Bybit Testnet Offline Idempotency
on:
  push:
    paths:
      - 'agents/bybit_testnet_intent_ledger_v311.py'
      - 'tests/test_bybit_testnet_intent_ledger_v311.py'
      - '.github/workflows/test_v311_bybit_testnet_idempotency.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_bybit_testnet_intent_ledger_v311.py' -v
