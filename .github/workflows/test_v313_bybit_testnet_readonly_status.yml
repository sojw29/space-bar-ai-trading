name: SPACE BAR V313 Bybit Testnet Readonly Status Parser
on:
  push:
    paths:
      - 'agents/bybit_testnet_readonly_status_v313.py'
      - 'tests/test_bybit_testnet_readonly_status_v313.py'
      - '.github/workflows/test_v313_bybit_testnet_readonly_status.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_bybit_testnet_readonly_status_v313.py' -v
