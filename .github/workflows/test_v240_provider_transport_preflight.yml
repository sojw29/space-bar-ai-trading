name: SPACE BAR V240 Provider Transport Preflight
on:
  push:
    paths:
      - 'agents/provider_transport_preflight_v240.py'
      - 'agents/test_v240_provider_transport_preflight.py'
      - '.github/workflows/test_v240_provider_transport_preflight.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v240_provider_transport_preflight.py' -v
