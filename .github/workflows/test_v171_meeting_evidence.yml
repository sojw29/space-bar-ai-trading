name: SPACE BAR V171 Meeting Evidence Trace

on:
  push:
    paths:
      - 'agents/meeting_quality_report_v166.py'
      - 'agents/test_v171_meeting_evidence.py'
      - '.github/workflows/test_v171_meeting_evidence.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Offline provenance tests
        run: python -m unittest discover -s agents -p 'test_v171_meeting_evidence.py' -v
