name: SPACE BAR V107 Market Regimes
on:
  push:
    paths:
      - 'agents/market_regime_v107.py'
      - 'agents/test_v107_market_regime.py'
      - '.github/workflows/test_v107_market_regime.yml'
  pull_request:
    paths:
      - 'agents/market_regime_v107.py'
      - 'agents/test_v107_market_regime.py'
      - '.github/workflows/test_v107_market_regime.yml'
  workflow_dispatch:
jobs:
  regime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v107_market_regime.py' -v
