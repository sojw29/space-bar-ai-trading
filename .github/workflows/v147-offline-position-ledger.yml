name: SPACE BAR V147 Offline Position Ledger
on:
  pull_request:
    paths:
      - 'agents/offline_position_ledger_v147.py'
      - 'agents/offline_paper_orders_v146.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_position_ledger_v147.py'
      - '.github/workflows/v147-offline-position-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'agents/offline_position_ledger_v147.py'
      - 'agents/offline_paper_orders_v146.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_position_ledger_v147.py'
      - '.github/workflows/v147-offline-position-ledger.yml'
  workflow_dispatch:
jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V147 ledger unit tests
        run: python -m unittest discover -s tests -p 'test_offline_position_ledger_v147.py' -v
