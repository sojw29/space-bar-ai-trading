name: V158 Agent Research Matrix
on:
  pull_request:
    paths:
      - 'web/office_3d.html'
      - 'tests/test_agent_matrix_v158.py'
      - '.github/workflows/v158-agent-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'web/office_3d.html'
      - 'tests/test_agent_matrix_v158.py'
      - '.github/workflows/v158-agent-matrix.yml'
  workflow_dispatch:
jobs:
  agent-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_agent_matrix_v158.py' -v
