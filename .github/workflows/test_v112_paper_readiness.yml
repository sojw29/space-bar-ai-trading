name: SPACE BAR V112 Paper Readiness
on:
  push:
    paths:
      - 'agents/paper_readiness_v112.py'
      - 'agents/test_v112_paper_readiness.py'
      - '.github/workflows/test_v112_paper_readiness.yml'
  pull_request:
    paths:
      - 'agents/paper_readiness_v112.py'
      - 'agents/test_v112_paper_readiness.py'
      - '.github/workflows/test_v112_paper_readiness.yml'
  workflow_dispatch:
jobs:
  readiness:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v112_paper_readiness.py' -v
