name: SPACE BAR V175 Local Meeting Export
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v175_meeting_history_export.py'
      - '.github/workflows/test_v175_meeting_history_export.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v175_meeting_history_export.py' -v
