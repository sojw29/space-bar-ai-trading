name: SPACE BAR V205 Scorecard Freshness
on:
  push:
    paths:
      - 'agents/scorecard_freshness_v205.py'
      - 'agents/dashboard_api_v28.py'
      - 'web/office_3d.html'
      - 'agents/test_v205_scorecard_freshness.py'
      - '.github/workflows/test_v205_scorecard_freshness.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v205_scorecard_freshness.py' -v
