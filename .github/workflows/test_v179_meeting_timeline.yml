name: SPACE BAR V179 Meeting Timeline
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v179_meeting_timeline.py'
      - '.github/workflows/test_v179_meeting_timeline.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meeting-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v179_meeting_timeline.py' -v
