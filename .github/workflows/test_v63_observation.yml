name: SPACE BAR V63 Observation Diagnostics
on:
  push:
    paths:
      - 'agents/observation_diagnostics_v63.py'
      - 'agents/test_v63_observation.py'
      - '.github/workflows/test_v63_observation.yml'
  pull_request:
    paths:
      - 'agents/observation_diagnostics_v63.py'
      - 'agents/test_v63_observation.py'
      - '.github/workflows/test_v63_observation.yml'
  workflow_dispatch:
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v63_observation.py' -v
