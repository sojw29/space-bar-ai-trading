name: SPACE BAR V73 Windows Smoke
on:
  push:
    paths:
      - 'agents/windows_smoke_v73.py'
      - 'agents/test_v73_windows_smoke.py'
      - '.github/workflows/test_v73_windows_smoke.yml'
  pull_request:
    paths:
      - 'agents/windows_smoke_v73.py'
      - 'agents/test_v73_windows_smoke.py'
      - '.github/workflows/test_v73_windows_smoke.yml'
  workflow_dispatch:
jobs:
  windows-smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v73_windows_smoke.py' -v
      - run: python agents/windows_smoke_v73.py --json
