name: SPACE BAR V66 Integrated Research Health
on:
  push:
    paths:
      - 'agents/research_health_v66.py'
      - 'agents/test_v66_health.py'
      - '.github/workflows/test_v66_health.yml'
  pull_request:
    paths:
      - 'agents/research_health_v66.py'
      - 'agents/test_v66_health.py'
      - '.github/workflows/test_v66_health.yml'
  workflow_dispatch:
jobs:
  offline-health-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v66_health.py' -v
