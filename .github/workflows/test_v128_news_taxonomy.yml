name: SPACE BAR V128 News Taxonomy
on:
  push:
    paths:
      - 'agents/news_taxonomy_v128.py'
      - 'agents/test_v128_news_taxonomy.py'
      - '.github/workflows/test_v128_news_taxonomy.yml'
  pull_request:
    paths:
      - 'agents/news_taxonomy_v128.py'
      - 'agents/test_v128_news_taxonomy.py'
      - '.github/workflows/test_v128_news_taxonomy.yml'
  workflow_dispatch:
jobs:
  offline-taxonomy-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v128_news_taxonomy.py' -v
