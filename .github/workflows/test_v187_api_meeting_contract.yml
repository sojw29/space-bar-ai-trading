name: SPACE BAR V187 Meeting API Contract
on:
  push:
    paths:
      - 'agents/dashboard_api_v28.py'
      - 'agents/meeting_contract_validator_v186.py'
      - 'agents/test_v187_api_meeting_contract.py'
      - '.github/workflows/test_v187_api_meeting_contract.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meeting-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v187_api_meeting_contract.py' -v
