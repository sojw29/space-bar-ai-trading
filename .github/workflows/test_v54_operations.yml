name: SPACE BAR V54 Local 3D Operations Panel

on:
  push:
    branches:
      - feature/v54-3d-operations-panel
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-operations-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python modules
        run: python -m compileall -q agents
      - name: Parse WebGL JavaScript module
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/office_3d.html').read_text(encoding='utf-8')
          Path('/tmp/spacebar-v54.mjs').write_text(
            s.split('<script type="module">',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/spacebar-v54.mjs
      - name: Existing local research and 3D contracts
        run: |
          python agents/test_v28_api.py
          python agents/test_v39_bridge.py
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
          python agents/test_v51_characters.py
          python agents/test_v52_market_wall.py
          python agents/test_v53_commander_room.py
      - name: V54 operations and fail-closed dashboard checks
        run: python agents/test_v54_operations.py
