name: SPACE BAR V220 Static Pages Safety
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v220_static_pages.py'
      - '.github/workflows/test_v220_static_pages.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-pages-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v220_static_pages.py' -v
