name: SPACE BAR V50 Interactive 3D Control Room

on:
  push:
    branches:
      - feature/v50-3d-control-room-polish
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-room-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q agents
      - name: Check Three.js module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/office_3d.html').read_text(encoding='utf-8')
          Path('/tmp/spacebar-v50.mjs').write_text(
            html.split('<script type="module">',1)[1].split('</script>',1)[0],
            encoding='utf-8')
          PY
          node --check /tmp/spacebar-v50.mjs
      - name: Offline read-only regressions
        run: |
          python agents/test_v28_api.py
          python agents/test_v29_dashboard.py
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
