name: SPACE BAR V134 News Intelligence History
on:
  push:
    paths:
      - 'agents/news_intelligence_history_v134.py'
      - 'agents/test_v134_news_intelligence_history.py'
      - '.github/workflows/test_v134_news_intelligence_history.yml'
  pull_request:
    paths:
      - 'agents/news_intelligence_history_v134.py'
      - 'agents/test_v134_news_intelligence_history.py'
      - '.github/workflows/test_v134_news_intelligence_history.yml'
  workflow_dispatch:
jobs:
  offline-news-history:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v134_news_intelligence_history.py' -v
