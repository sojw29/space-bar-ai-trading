name: SPACE BAR V37 Closed Candle Stream

on:
  push:
    branches:
      - feature/v37-closed-candle-stream
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candle-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile agents
        run: python -m compileall -q agents
      - name: Historical research and stream regression
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v28_api.py
          python agents/test_v36_paper.py
          python agents/test_v37_stream.py
