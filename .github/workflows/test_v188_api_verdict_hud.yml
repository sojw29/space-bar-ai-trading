name: SPACE BAR V188 Meeting API Verdict HUD
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v188_api_verdict_hud.py'
      - '.github/workflows/test_v188_api_verdict_hud.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meeting-api-verdict-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v188_api_verdict_hud.py' -v
