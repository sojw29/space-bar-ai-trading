name: SPACE BAR V190 Meeting HTTP Fault Injection
on:
  push:
    paths:
      - 'agents/dashboard_api_v28.py'
      - 'agents/meeting_contract_validator_v186.py'
      - 'agents/test_v190_meeting_http_fault_injection.py'
      - 'web/office_3d.html'
      - '.github/workflows/test_v190_meeting_http_fault_injection.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meeting-http-fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v190_meeting_http_fault_injection.py' -v
