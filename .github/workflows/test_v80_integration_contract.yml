name: SPACE BAR V80 Integration Contract
on:
  push:
    paths:
      - 'agents/integration_contract_v80.py'
      - 'agents/test_v80_integration_contract.py'
      - '.github/workflows/test_v80_integration_contract.yml'
  pull_request:
    paths:
      - 'agents/integration_contract_v80.py'
      - 'agents/test_v80_integration_contract.py'
      - '.github/workflows/test_v80_integration_contract.yml'
  workflow_dispatch:
jobs:
  integration-contract:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v80_integration_contract.py' -v
      - run: python agents/integration_contract_v80.py --json
