name: SPACE BAR V138 News Statistics Comparison
on:
  push:
    paths:
      - 'agents/news_statistics_comparison_v138.py'
      - 'agents/test_v138_news_statistics_comparison.py'
      - '.github/workflows/test_v138_news_statistics_comparison.yml'
  pull_request:
    paths:
      - 'agents/news_statistics_comparison_v138.py'
      - 'agents/test_v138_news_statistics_comparison.py'
      - '.github/workflows/test_v138_news_statistics_comparison.yml'
  workflow_dispatch:
jobs:
  offline-news-comparison:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v138_news_statistics_comparison.py' -v
