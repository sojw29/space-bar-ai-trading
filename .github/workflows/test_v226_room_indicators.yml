name: SPACE BAR V226 3D Indicator Research Panel
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v226_room_indicators.py'
      - '.github/workflows/test_v226_room_indicators.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v226_room_indicators.py' -v
