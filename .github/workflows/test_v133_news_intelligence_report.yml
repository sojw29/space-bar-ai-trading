name: SPACE BAR V133 News Intelligence Report
on:
  push:
    paths:
      - 'agents/news_intelligence_report_v133.py'
      - 'agents/test_v133_news_intelligence_report.py'
      - '.github/workflows/test_v133_news_intelligence_report.yml'
  pull_request:
    paths:
      - 'agents/news_intelligence_report_v133.py'
      - 'agents/test_v133_news_intelligence_report.py'
      - '.github/workflows/test_v133_news_intelligence_report.yml'
  workflow_dispatch:
jobs:
  offline-news-report:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v133_news_intelligence_report.py' -v
