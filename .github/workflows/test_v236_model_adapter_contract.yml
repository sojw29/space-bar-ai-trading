name: SPACE BAR V236 Offline Model Adapter Contract
on:
  push:
    paths:
      - 'agents/model_adapter_contract_v236.py'
      - 'agents/test_v236_model_adapter_contract.py'
      - '.github/workflows/test_v236_model_adapter_contract.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v236_model_adapter_contract.py' -v
