name: SPACE BAR V231 Local Research Change Detection
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v231_local_change_panel.py'
      - '.github/workflows/test_v231_local_change_panel.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v231_local_change_panel.py' -v
