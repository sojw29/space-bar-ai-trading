name: SPACE BAR V176 Offline Meeting Import
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v176_meeting_history_import.py'
      - '.github/workflows/test_v176_meeting_history_import.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v176_meeting_history_import.py' -v
