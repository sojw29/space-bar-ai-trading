name: SPACE BAR V53 3D Commander Consensus

on:
  push:
    branches:
      - feature/v53-commander-consensus-3d
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commander-3d-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python
        run: python -m compileall -q agents
      - name: Check Three.js script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/office_3d.html').read_text(encoding='utf-8')
          Path('/tmp/space-bar-v53.mjs').write_text(
            html.split('<script type="module">',1)[1].split('</script>',1)[0],
            encoding='utf-8')
          PY
          node --check /tmp/space-bar-v53.mjs
      - name: Offline safety and 3D regressions
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v33_consensus.py
          python agents/test_v28_api.py
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
          python agents/test_v51_characters.py
          python agents/test_v52_market_wall.py
          python agents/test_v53_commander_room.py
