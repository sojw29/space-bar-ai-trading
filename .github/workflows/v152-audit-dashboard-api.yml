name: V152 Audit Dashboard API
on:
  pull_request:
    paths:
      - 'agents/dashboard_api_v28.py'
      - 'tests/test_replay_audit_api_v152.py'
      - '.github/workflows/v152-audit-dashboard-api.yml'
  push:
    branches: [main]
    paths:
      - 'agents/dashboard_api_v28.py'
      - 'tests/test_replay_audit_api_v152.py'
      - '.github/workflows/v152-audit-dashboard-api.yml'
  workflow_dispatch:
jobs:
  audit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_replay_audit_api_v152.py' -v
