name: SPACE BAR V51 Evidence-bound 3D Agent Characters

on:
  push:
    branches:
      - feature/v51-agent-character-states
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-character-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile agents
        run: python -m compileall -q agents
      - name: Syntax-check 3D module
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/office_3d.html').read_text(encoding='utf-8')
          Path('/tmp/spacebar-v51.mjs').write_text(
              s.split('<script type="module">',1)[1].split('</script>',1)[0],
              encoding='utf-8')
          PY
          node --check /tmp/spacebar-v51.mjs
      - name: Offline UI and localhost regressions
        run: |
          python agents/test_v28_api.py
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
          python agents/test_v51_characters.py
