name: SPACE BAR V45 End-to-End Safety Contracts

on:
  push:
    branches:
      - feature/v45-full-stack-safety-tests
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python modules
        run: python -m compileall -q agents
      - name: Validate dashboard Javascript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/command_center.html').read_text(encoding='utf-8')
          Path('/tmp/space-bar-v45.js').write_text(
              html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/space-bar-v45.js
      - name: Offline integration safety regression
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v37_stream.py
          python agents/test_v38_binance_ws.py
          python agents/test_v39_bridge.py
          python agents/test_v40_warmup.py
          python agents/test_v41_portfolio.py
          python agents/test_v42_paper_monitor.py
          python agents/test_v43_journal.py
          python agents/test_v44_analytics.py
          python agents/test_v45_full_stack.py
