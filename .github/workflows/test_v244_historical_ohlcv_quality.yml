name: SPACE BAR V244 Historical OHLCV Quality Gate
on:
  push:
    paths:
      - 'agents/historical_ohlcv_quality_v244.py'
      - 'agents/test_v244_historical_ohlcv_quality.py'
      - '.github/workflows/test_v244_historical_ohlcv_quality.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s agents -p 'test_v244_historical_ohlcv_quality.py' -v
