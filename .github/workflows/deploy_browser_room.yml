name: SPACE BAR Browser Room GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy_browser_room.yml'
      - 'agents/pages_snapshot_v222.py'
      - 'reports/strategy_scorecard_latest.json'
      - 'agents/public_market_snapshot_v223.py'
      - 'agents/public_market_diagnostics_v224.py'
      - 'agents/ohlcv_indicators_v225.py'
      - 'agents/agent_indicator_interpretation_v228.py'
      - 'agents/commander_research_brief_v229.py'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: browser-room-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static room files
        run: |
          test -s web/index.html
          test -s web/office_3d.html
          test -s web/command_center.html
          grep -q '읽기 전용 데모' web/index.html
      - name: Publish only validated optional historical scorecard
        run: |
          python agents/pages_snapshot_v222.py reports/strategy_scorecard_latest.json web/research_snapshot.json
      - name: Collect public research-only market snapshot
        id: market_snapshot
        continue-on-error: true
        run: python agents/public_market_snapshot_v223.py web/market_snapshot.json
      - name: Report unavailable optional ticker snapshot
        if: ${{ steps.market_snapshot.outcome == 'failure' }}
        run: |
          echo "::warning::Public ticker collection failed; deploying without a market snapshot."
          echo "Public ticker data unavailable for this deployment (no live market prices)." >> "$GITHUB_STEP_SUMMARY"
      - name: Assess published ticker snapshot without order execution
        run: |
          if test -s web/market_snapshot.json; then
            python agents/public_market_diagnostics_v224.py web/market_snapshot.json web/market_diagnostics.json
          else
            rm -f web/market_diagnostics.json
          fi
      - name: Collect completed public OHLCV indicators (optional)
        id: ohlcv_snapshot
        continue-on-error: true
        run: python agents/ohlcv_indicators_v225.py web/ohlcv_indicators.json
      - name: Report unavailable optional OHLCV indicators
        if: ${{ steps.ohlcv_snapshot.outcome == 'failure' }}
        run: |
          echo "::warning::Public OHLCV collection failed; deploying without indicator data."
          echo "Public OHLCV indicators unavailable for this deployment (no derived agent descriptions)." >> "$GITHUB_STEP_SUMMARY"
      - name: Derive safe agent-labeled indicator descriptions
        run: |
          if test -s web/ohlcv_indicators.json; then
            python agents/agent_indicator_interpretation_v228.py web/ohlcv_indicators.json web/agent_interpretations.json
          else
            rm -f web/agent_interpretations.json
          fi
      - name: Compile deterministic COMMANDER research brief
        run: |
          if test -s web/agent_interpretations.json; then
            python agents/commander_research_brief_v229.py web/agent_interpretations.json web/commander_brief.json
          else
            rm -f web/commander_brief.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
