name: SPACE BAR V148 Offline Performance Tracker
on:
  pull_request:
    paths:
      - 'agents/offline_performance_tracker_v148.py'
      - 'tests/test_offline_performance_tracker_v148.py'
      - '.github/workflows/v148-offline-performance-tracker.yml'
  push:
    branches: [main]
    paths:
      - 'agents/offline_performance_tracker_v148.py'
      - 'tests/test_offline_performance_tracker_v148.py'
      - '.github/workflows/v148-offline-performance-tracker.yml'
  workflow_dispatch:
jobs:
  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V148 offline performance tests
        run: python -m unittest discover -s tests -p 'test_offline_performance_tracker_v148.py' -v
