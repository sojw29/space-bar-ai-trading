name: SPACE BAR V312 Durable Testnet Intent Ledger
on:
  push:
    paths:
      - 'agents/bybit_testnet_durable_ledger_v312.py'
      - 'tests/test_bybit_testnet_durable_ledger_v312.py'
      - '.github/workflows/test_v312_bybit_testnet_durable_ledger.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_bybit_testnet_durable_ledger_v312.py' -v
