name: SPACE BAR V124 Report History
on:
  push:
    paths:
      - 'agents/report_history_v124.py'
      - 'agents/test_v124_report_history.py'
      - '.github/workflows/test_v124_report_history.yml'
  pull_request:
    paths:
      - 'agents/report_history_v124.py'
      - 'agents/test_v124_report_history.py'
      - '.github/workflows/test_v124_report_history.yml'
  workflow_dispatch:
jobs:
  report-history:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v124_report_history.py' -v
