name: SPACE BAR V232 Local History Chart
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v232_history_chart.py'
      - '.github/workflows/test_v232_history_chart.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v232_history_chart.py' -v
