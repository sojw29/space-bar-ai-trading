name: SPACE BAR V122 Research Risk Warnings
on:
  push:
    paths:
      - 'agents/research_risk_warnings_v122.py'
      - 'agents/test_v122_research_risk_warnings.py'
      - '.github/workflows/test_v122_research_risk_warnings.yml'
  pull_request:
    paths:
      - 'agents/research_risk_warnings_v122.py'
      - 'agents/test_v122_research_risk_warnings.py'
      - '.github/workflows/test_v122_research_risk_warnings.yml'
  workflow_dispatch:
jobs:
  risk-warnings:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v122_research_risk_warnings.py' -v
