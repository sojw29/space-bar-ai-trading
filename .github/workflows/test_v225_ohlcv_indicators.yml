name: SPACE BAR V225 Historical Candle Indicators
on:
  push:
    paths:
      - 'agents/ohlcv_indicators_v225.py'
      - 'agents/test_v225_ohlcv_indicators.py'
      - 'web/index.html'
      - '.github/workflows/deploy_browser_room.yml'
      - '.github/workflows/test_v225_ohlcv_indicators.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v225_ohlcv_indicators.py' -v
