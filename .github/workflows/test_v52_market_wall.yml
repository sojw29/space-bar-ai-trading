name: SPACE BAR V52 Verified 3D Market Wall

on:
  push:
    branches:
      - feature/v52-3d-market-wall
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-wall-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python compile
        run: python -m compileall -q agents
      - name: 3D JS module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('web/office_3d.html').read_text(encoding='utf-8')
          Path('/tmp/spacebar-v52.mjs').write_text(
            h.split('<script type="module">',1)[1].split('</script>',1)[0],
            encoding='utf-8')
          PY
          node --check /tmp/spacebar-v52.mjs
      - name: Prior offline market feed and dashboard regressions
        run: |
          python agents/test_v28_api.py
          python agents/test_v37_stream.py
          python agents/test_v38_binance_ws.py
          python agents/test_v39_bridge.py
          python agents/test_v40_warmup.py
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
          python agents/test_v51_characters.py
      - name: New validated read-only market wall regression
        run: python agents/test_v52_market_wall.py
