name: SPACE BAR V114 Paper Performance
on:
  push:
    paths:
      - 'agents/paper_performance_v114.py'
      - 'agents/test_v114_paper_performance.py'
      - '.github/workflows/test_v114_paper_performance.yml'
  pull_request:
    paths:
      - 'agents/paper_performance_v114.py'
      - 'agents/test_v114_paper_performance.py'
      - '.github/workflows/test_v114_paper_performance.yml'
  workflow_dispatch:
jobs:
  paper-performance:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v114_paper_performance.py' -v
