name: SPACE BAR V84 Desktop Status
on:
  push:
    paths:
      - 'agents/desktop_status_v84.py'
      - 'agents/test_v84_desktop_status.py'
      - '.github/workflows/test_v84_desktop_status.yml'
  pull_request:
    paths:
      - 'agents/desktop_status_v84.py'
      - 'agents/test_v84_desktop_status.py'
      - '.github/workflows/test_v84_desktop_status.yml'
  workflow_dispatch:
jobs:
  desktop-status-headless:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v84_desktop_status.py' -v
      - name: Headless dashboard smoke test
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable, "agents/desktop_status_v84.py", "--headless"], capture_output=True, text=True)
          assert p.returncode in (0, 1), p.stderr
          assert '"live_trading_approved": false' in p.stdout.lower()
