name: SPACE BAR AI Backtest V8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean previous market data
        run: |
          rm -rf data/history
          mkdir -p data/history

      - name: Collect Binance Futures history
        run: python agents/history.py

      - name: Verify futures data
        run: |
          python - <<'PY'
          import csv
          import os
          import sys

          symbols = ["BTC", "ETH", "SOL"]
          timeframes = [1, 5, 15]
          errors = []

          for symbol in symbols:
              for timeframe in timeframes:
                  path = f"data/history/{symbol}_{timeframe}m.csv"

                  if not os.path.isfile(path):
                      errors.append(f"Missing: {path}")
                      continue

                  count = 0
                  previous_timestamp = None

                  with open(path, newline="") as f:
                      reader = csv.DictReader(f)

                      for row in reader:
                          timestamp = int(float(row["timestamp"]))
                          count += 1

                          if (
                              previous_timestamp is not None
                              and timestamp <= previous_timestamp
                          ):
                              errors.append(
                                  f"Invalid timestamp: {path}"
                              )

                          previous_timestamp = timestamp

                  print(f"{path}: {count} candles")

                  if count < 600:
                      errors.append(
                          f"Insufficient data: {path}"
                      )

          if errors:
              for error in errors:
                  print("ERROR:", error)
              sys.exit(1)

          print("All Binance Futures data files verified.")
          PY

      - name: Run V6 diagnostic backtest
        run: python agents/tester_v6.py

      - name: Save V6 backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v8-reports
          path: reports/v6/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Binance Futures data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v8-futures-data
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 14
