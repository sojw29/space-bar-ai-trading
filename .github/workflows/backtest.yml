name: SPACE BAR AI Backtest V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect market history
        run: python agents/history.py

      - name: Check downloaded data
        run: |
          python - <<'PY'
          import os
          import sys

          symbols = ["BTC", "ETH", "SOL"]
          timeframes = ["1", "5", "15"]

          missing = []

          for symbol in symbols:
              for timeframe in timeframes:
                  path = f"data/history/{symbol}_{timeframe}m.csv"

                  if not os.path.exists(path):
                      missing.append(path)
                  else:
                      print("FOUND:", path)

          if missing:
              print("Missing files:", missing)
              sys.exit(1)

          print("All 9 market data files found.")
          PY

      - name: Run V5 robustness backtest
        run: python agents/tester_v5.py

      - name: Save backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v5-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Save market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-market-data
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 7
