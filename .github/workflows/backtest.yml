name: SPACE BAR AI Backtest V10

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-bar-backtest-v10
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 프로젝트 다운로드
      - name: Download project
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 데이터 폴더 준비
      - name: Prepare folders
        run: |
          mkdir -p data/history
          mkdir -p reports/v10

      # 4. Binance Futures 과거 데이터 수집
      - name: Collect Binance Futures data
        run: |
          python agents/history.py

      # 5. BTC 5분봉 데이터 확인
      - name: Verify BTC 5m data
        run: |
          python - <<'PY'
          import csv
          import os

          path = "data/history/BTC_5m.csv"

          if not os.path.exists(path):
              raise RuntimeError(
                  "BTC 5m data file not found."
              )

          with open(path, encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              count = sum(1 for _ in reader)

          print("BTC 5m candles:", count)

          if count < 1000:
              raise RuntimeError(
                  "Insufficient BTC 5m candles."
              )

          print("BTC 5m data verified.")
          PY

      # 6. V10 백테스트 실행
      - name: Run V10 research backtest
        run: |
          python agents/tester_v10.py

      # 7. V10 보고서 저장
      - name: Save V10 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v10-reports
          path: reports/v10/
          if-no-files-found: warn
          retention-days: 30

      # 8. 시장 데이터 저장
      - name: Save Binance Futures data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v10-futures-data
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 14
