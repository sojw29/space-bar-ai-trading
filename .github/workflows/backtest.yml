name: SPACE BAR AI Backtest V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect market history
        run: python agents/history.py

      - name: Verify BTC 5m data
        run: |
          python - <<'PY'
          import csv
          import os

          path = "data/history/BTC_5m.csv"

          if not os.path.exists(path):
              raise RuntimeError(f"Missing data: {path}")

          with open(path, newline="", encoding="utf-8-sig") as f:
              count = sum(1 for _ in csv.reader(f)) - 1

          print(f"BTC 5m candles: {count}")

          if count < 1000:
              raise RuntimeError("Insufficient BTC 5m candles")
          PY

      - name: Run V13 research backtest
        run: python agents/tester_v13.py

      - name: Save V13 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v13-reports
          path: reports/v13/
          if-no-files-found: warn
          retention-days: 30

      - name: Save market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v13-market-data
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 30
