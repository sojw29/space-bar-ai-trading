name: SPACE BAR AI Backtest V11

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: space-bar-backtest-v11
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ========================================
      # 1. DOWNLOAD PROJECT
      # ========================================

      - name: Download project
        uses: actions/checkout@v4

      # ========================================
      # 2. INSTALL PYTHON
      # ========================================

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================================
      # 3. COLLECT MARKET DATA
      # ========================================

      - name: Collect Binance Futures data
        run: |
          python agents/history.py

      # ========================================
      # 4. VERIFY MARKET DATA
      # ========================================

      - name: Verify BTC 5M data
        run: |
          python - <<'PY'
          import csv
          import os
          import sys

          path = "data/history/BTC_5m.csv"

          if not os.path.exists(path):
              print("ERROR: BTC 5M data missing")
              sys.exit(1)

          with open(path, newline="") as f:
              reader = csv.DictReader(f)
              count = sum(1 for _ in reader)

          print("BTC 5M candles:", count)

          if count < 1000:
              print("ERROR: Insufficient market history")
              sys.exit(1)

          print("Market data verified")
          PY

      # ========================================
      # 5. VERIFY V11 FILE
      # ========================================

      - name: Verify V11 engine
        run: |
          test -f agents/tester.py
          test -f agents/tester_v10.py
          test -f agents/tester_v11.py

          python -m py_compile \
            agents/tester.py \
            agents/tester_v10.py \
            agents/tester_v11.py

          echo "V11 engine verified"

      # ========================================
      # 6. RUN V11 BACKTEST
      # ========================================

      - name: Run V11 research backtest
        run: |
          python agents/tester_v11.py

      # ========================================
      # 7. SAVE REPORTS
      # ========================================

      - name: Save V11 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v11-reports
          path: reports/v11/
          if-no-files-found: warn
          retention-days: 30

      # ========================================
      # 8. SAVE MARKET DATA
      # ========================================

      - name: Save Binance Futures data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-v11-market-data
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 30
