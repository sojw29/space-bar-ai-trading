name: SPACE BAR AI Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect market history
        run: python agents/history.py

      - name: Check downloaded data
        run: |
          python - <<'PY'
          import os
          import sys

          symbols = ["BTC", "ETH", "SOL"]
          intervals = ["1", "5", "15"]

          missing = []

          for symbol in symbols:
              for interval in intervals:
                  path = f"data/history/{symbol}_{interval}m.csv"

                  if not os.path.isfile(path):
                      missing.append(path)
                  else:
                      print(f"OK: {path}")

          if missing:
              sys.exit(f"Missing data: {missing}")

          print("All 9 CSV files found.")
          PY

      - name: Run backtest
        run: python agents/tester.py

      - name: Save backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-backtest-reports
          path: |
            reports/*.json
            reports/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Save market history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-bar-market-history
          path: data/history/*.csv
          if-no-files-found: warn
          retention-days: 7
