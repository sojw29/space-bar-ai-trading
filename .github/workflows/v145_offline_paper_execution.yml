name: SPACE BAR V145 Offline Paper Fill Validation

on:
  push:
    branches: [main]
    paths:
      - "agents/offline_paper_execution_v145.py"
      - "tests/test_offline_paper_execution_v145.py"
      - ".github/workflows/v145_offline_paper_execution.yml"
  pull_request:
    paths:
      - "agents/offline_paper_execution_v145.py"
      - "tests/test_offline_paper_execution_v145.py"
      - ".github/workflows/v145_offline_paper_execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-paper-fill-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run V145 offline-only tests
        run: python -m unittest discover -s tests -p "test_offline_paper_execution_v145.py" -v
