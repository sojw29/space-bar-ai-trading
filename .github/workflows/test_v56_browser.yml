name: SPACE BAR V56 Real Chromium WebGL Smoke

on:
  push:
    branches:
      - feature/v56-browser-webgl-smoke
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACEBAR_BROWSER_ARTIFACTS: reports/v56/browser-artifacts
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tools
        working-directory: web/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline Python compile and previously built 3D contracts
        run: |
          python -m compileall -q agents
          python agents/test_v49_3d_office.py
          python agents/test_v50_3d_controls.py
          python agents/test_v51_characters.py
          python agents/test_v52_market_wall.py
          python agents/test_v53_commander_room.py
          python agents/test_v54_operations.py
          python agents/test_v55_webgl_recovery.py
      - name: Chromium software-WebGL smoke vs actual localhost server
        working-directory: web/e2e
        run: npm test
      - name: Upload browser screenshots (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v56-browser-webgl-screenshots
          path: reports/v56/browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
