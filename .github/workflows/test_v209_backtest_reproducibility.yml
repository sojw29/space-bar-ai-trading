name: SPACE BAR V209 Backtest Reproducibility
on:
  push:
    paths:
      - 'agents/publish_scorecard_v203.py'
      - 'agents/test_v209_backtest_reproducibility.py'
      - '.github/workflows/test_v209_backtest_reproducibility.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v209_backtest_reproducibility.py' -v
