name: SPACE BAR AI Backtest V18

on:
  push:
    branches:
      - research/v18-performance-monitor
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  longitudinal-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Collect BTC history
        run: python agents/history.py
      - name: Retrieve previous V18 main snapshot when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous_v18
          previous_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backtest_v18.yml --branch main --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [ -n "$previous_id" ]; then
            gh run download "$previous_id" --repo "$GITHUB_REPOSITORY" --name space-bar-v18-monitor --dir previous_v18 || echo "Prior artifact unavailable; first-snapshot mode."
          else
            echo "No previous successful V18 main run; first-snapshot mode."
          fi
      - name: Run V18 paper monitoring
        run: python agents/tester_v18.py
      - name: Upload V18 monitoring reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: space-bar-v18-monitor
          path: reports/v18/
          if-no-files-found: warn
          retention-days: 90
