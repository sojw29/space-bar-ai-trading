name: SPACE BAR V34 Immutable Research Ledger

on:
  push:
    branches:
      - feature/v34-decision-ledger
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q agents
      - name: Ledger and prior agent tests
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v28_api.py
          python agents/test_v34_ledger.py
