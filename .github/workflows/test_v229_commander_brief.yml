name: SPACE BAR V229 COMMANDER Research Brief
on:
  push:
    paths:
      - 'agents/commander_research_brief_v229.py'
      - 'agents/test_v229_commander_brief.py'
      - 'agents/test_room_summary_expiry.py'
      - 'web/office_3d.html'
      - '.github/workflows/deploy_browser_room.yml'
      - '.github/workflows/test_v229_commander_brief.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commander-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v229_commander_brief.py' -v
      - name: Require Node.js for summary-panel lifecycle tests
        run: node --version
      - run: python -m unittest discover -s agents -p 'test_room_summary_expiry.py' -v
