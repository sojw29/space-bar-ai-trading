name: SPACE BAR V143 News Dashboard Data
on:
  push:
    paths:
      - 'agents/news_intelligence_dashboard_data_v143.py'
      - 'agents/test_v143_news_intelligence_dashboard_data.py'
      - '.github/workflows/test_v143_news_intelligence_dashboard_data.yml'
  pull_request:
    paths:
      - 'agents/news_intelligence_dashboard_data_v143.py'
      - 'agents/test_v143_news_intelligence_dashboard_data.py'
      - '.github/workflows/test_v143_news_intelligence_dashboard_data.yml'
  workflow_dispatch:
jobs:
  offline-news-dashboard-data:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v143_news_intelligence_dashboard_data.py' -v
