name: SPACE BAR V202 Room Scorecard Auto Fetch
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v202_room_scorecard_auto_fetch.py'
      - '.github/workflows/test_v202_room_scorecard_auto_fetch.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-scorecard-auto-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v202_room_scorecard_auto_fetch.py' -v
