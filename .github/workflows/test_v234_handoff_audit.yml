name: SPACE BAR V234 Auditable Research Handoff
on:
  push:
    paths:
      - 'agents/agent_handoff_audit_v234.py'
      - 'agents/test_v234_handoff_audit.py'
      - '.github/workflows/test_v234_handoff_audit.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v234_handoff_audit.py' -v
