name: SPACE BAR V242 Offline Network Guardrail
on:
  push:
    paths:
      - 'agents/offline_network_guard_v242.py'
      - 'agents/test_v242_offline_network_guard.py'
      - '.github/workflows/test_v242_offline_network_guard.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v242_offline_network_guard.py' -v
