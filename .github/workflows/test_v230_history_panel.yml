name: SPACE BAR V230 Local Research History
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v230_history_panel.py'
      - 'agents/test_history_clear_race.py'
      - '.github/workflows/test_v230_history_panel.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v230_history_panel.py' -v
      - name: Require Node.js for local-history lifecycle regression
        run: node --version
      - run: python -m unittest discover -s agents -p 'test_history_clear_race.py' -v
