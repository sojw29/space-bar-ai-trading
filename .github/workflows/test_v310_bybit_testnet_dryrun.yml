name: SPACE BAR V310 Bybit Testnet Dry-Run Safety
on:
  push:
    paths:
      - 'agents/bybit_testnet_order_dryrun_v310.py'
      - 'tests/test_bybit_testnet_order_dryrun_v310.py'
      - '.github/workflows/test_v310_bybit_testnet_dryrun.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dryrun-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_bybit_testnet_order_dryrun_v310.py' -v
