name: SPACE BAR V222 Public Historical Snapshot
on:
  push:
    paths:
      - 'agents/pages_snapshot_v222.py'
      - 'agents/test_v222_pages_snapshot.py'
      - 'web/office_3d.html'
      - '.github/workflows/deploy_browser_room.yml'
      - '.github/workflows/test_v222_pages_snapshot.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v222_pages_snapshot.py' -v
