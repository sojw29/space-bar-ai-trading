name: SPACE BAR V213 Regime Sample Adequacy
on:
  push:
    paths:
      - 'agents/regime_sample_adequacy_v213.py'
      - 'agents/publish_scorecard_v203.py'
      - 'agents/test_v213_regime_sample_adequacy.py'
      - '.github/workflows/test_v213_regime_sample_adequacy.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regime-sample-adequacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v213_regime_sample_adequacy.py' -v
