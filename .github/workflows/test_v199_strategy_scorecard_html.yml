name: SPACE BAR V199 Offline Scorecard HTML
on:
  push:
    paths:
      - 'agents/strategy_scorecard_html_v199.py'
      - 'agents/test_v199_strategy_scorecard_html.py'
      - '.github/workflows/test_v199_strategy_scorecard_html.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-scorecard-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v199_strategy_scorecard_html.py' -v
