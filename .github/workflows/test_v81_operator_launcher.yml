name: SPACE BAR V81 Operator Launcher
on:
  push:
    paths:
      - 'agents/operator_launcher_v81.py'
      - 'agents/test_v81_operator_launcher.py'
      - '.github/workflows/test_v81_operator_launcher.yml'
  pull_request:
    paths:
      - 'agents/operator_launcher_v81.py'
      - 'agents/test_v81_operator_launcher.py'
      - '.github/workflows/test_v81_operator_launcher.yml'
  workflow_dispatch:
jobs:
  operator-launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v81_operator_launcher.py' -v
      - run: python agents/operator_launcher_v81.py self-test --json
