name: SPACE BAR V29 Command Center UI

on:
  push:
    branches:
      - feature/v29-command-center-ui
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q agents
      - name: Run multi-agent, API and UI smoke tests
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v28_api.py
          python agents/test_v29_dashboard.py
