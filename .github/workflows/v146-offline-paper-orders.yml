name: SPACE BAR V146 Offline Paper Orders
on:
  pull_request:
    paths:
      - 'agents/offline_paper_orders_v146.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_paper_orders_v146.py'
      - '.github/workflows/v146-offline-paper-orders.yml'
  push:
    branches: [main]
    paths:
      - 'agents/offline_paper_orders_v146.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_paper_orders_v146.py'
      - '.github/workflows/v146-offline-paper-orders.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test V145 and V146 offline simulation
        run: python -m unittest discover -s tests -p 'test_offline_paper*py' -v
