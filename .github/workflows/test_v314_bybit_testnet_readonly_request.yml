name: SPACE BAR V314 Bybit Testnet Readonly Query Descriptor
on:
  push:
    paths:
      - 'agents/bybit_testnet_readonly_request_v314.py'
      - 'tests/test_bybit_testnet_readonly_request_v314.py'
      - '.github/workflows/test_v314_bybit_testnet_readonly_request.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_bybit_testnet_readonly_request_v314.py' -v
