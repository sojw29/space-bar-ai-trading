name: SPACE BAR V221 Offline Research Import
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v221_offline_research_import.py'
      - '.github/workflows/test_v221_offline_research_import.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-research-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v221_offline_research_import.py' -v
