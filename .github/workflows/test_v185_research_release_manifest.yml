name: SPACE BAR V185 Research Release Manifest
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v185_research_release_manifest.py'
      - '.github/workflows/test_v185_research_release_manifest.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v185_research_release_manifest.py' -v
