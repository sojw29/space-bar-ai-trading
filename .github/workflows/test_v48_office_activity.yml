name: SPACE BAR V48 Observable Office Activity

on:
  push:
    branches:
      - feature/v48-office-activity-visualization
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-activity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python compile
        run: python -m compileall -q agents
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/command_center.html').read_text(encoding='utf-8')
          Path('/tmp/space-bar-v48.js').write_text(
              html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/space-bar-v48.js
      - name: Research room regressions
        run: |
          python agents/test_v29_dashboard.py
          python agents/test_v30_room.py
          python agents/test_v31_activity.py
          python agents/test_v32_inspector.py
          python agents/test_v33_consensus.py
          python agents/test_v47_office.py
          python agents/test_v48_office_activity.py
