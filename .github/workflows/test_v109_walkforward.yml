name: SPACE BAR V109 Walkforward
on:
  push:
    paths:
      - 'agents/walkforward_v109.py'
      - 'agents/test_v109_walkforward.py'
      - '.github/workflows/test_v109_walkforward.yml'
  pull_request:
    paths:
      - 'agents/walkforward_v109.py'
      - 'agents/test_v109_walkforward.py'
      - '.github/workflows/test_v109_walkforward.yml'
  workflow_dispatch:
jobs:
  walkforward:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v109_walkforward.py' -v
