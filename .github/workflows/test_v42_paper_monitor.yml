name: SPACE BAR V42 Local Paper Feed Monitor

on:
  push:
    branches:
      - feature/v42-paper-feed-monitor
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python
        run: python -m compileall -q agents
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('web/command_center.html').read_text(encoding='utf-8')
          Path('/tmp/space-bar-v42.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/space-bar-v42.js
      - name: Test agent, feed and simulated portfolio
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v28_api.py
          python agents/test_v38_binance_ws.py
          python agents/test_v39_bridge.py
          python agents/test_v40_warmup.py
          python agents/test_v41_portfolio.py
          python agents/test_v42_paper_monitor.py
