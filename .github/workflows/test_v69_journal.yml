name: SPACE BAR V69 Research Journal
on:
  push:
    paths:
      - 'agents/research_journal_v69.py'
      - 'agents/test_v69_journal.py'
      - '.github/workflows/test_v69_journal.yml'
  pull_request:
    paths:
      - 'agents/research_journal_v69.py'
      - 'agents/test_v69_journal.py'
      - '.github/workflows/test_v69_journal.yml'
  workflow_dispatch:
jobs:
  offline-journal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v69_journal.py' -v
