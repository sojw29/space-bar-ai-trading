name: SPACE BAR V223 Public Market Snapshot
on:
  push:
    paths:
      - 'agents/public_market_snapshot_v223.py'
      - 'agents/test_v223_public_market_snapshot.py'
      - 'web/index.html'
      - '.github/workflows/deploy_browser_room.yml'
      - '.github/workflows/test_v223_public_market_snapshot.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v223_public_market_snapshot.py' -v
