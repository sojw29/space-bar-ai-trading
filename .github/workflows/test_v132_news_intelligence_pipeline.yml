name: SPACE BAR V132 News Intelligence Pipeline
on:
  push:
    paths:
      - 'agents/news_intelligence_pipeline_v132.py'
      - 'agents/test_v132_news_intelligence_pipeline.py'
      - '.github/workflows/test_v132_news_intelligence_pipeline.yml'
  pull_request:
    paths:
      - 'agents/news_intelligence_pipeline_v132.py'
      - 'agents/test_v132_news_intelligence_pipeline.py'
      - '.github/workflows/test_v132_news_intelligence_pipeline.yml'
  workflow_dispatch:
jobs:
  offline-news-pipeline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v132_news_intelligence_pipeline.py' -v
