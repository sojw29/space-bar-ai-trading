name: SPACE BAR AI V25 Evidence Readiness

on:
  push:
    branches:
      - research/v25-evidence-readiness
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '10 10 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  evidence-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile modules
        run: python -m compileall -q agents
      - name: Offline regression tests
        run: |
          python agents/test_v23_regression.py
          python agents/test_v24_report.py
          python agents/test_v25_readiness.py
      - name: Collect market history
        run: python agents/history.py
      - name: Restore prior main V21/V22 snapshots (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous_v21 previous_v22
          for version in v21 v22; do
            case "$version" in
              v21) artifact=space-bar-v21-audit; target=previous_v21 ;;
              v22) artifact=space-bar-v22-evidence; target=previous_v22 ;;
            esac
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "backtest_${version}.yml" --branch main --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
            if [ -n "$id" ]; then
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$target" ||
                echo "WARNING: Previous $version artifact unavailable; evidence remains unverified"
            else
              echo "WARNING: No previous successful $version main run"
            fi
          done
      - name: Run V25 evidence readiness
        run: python agents/tester_v25.py
      - name: Upload paper research reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: space-bar-v25-readiness
          path: |
            reports/v17/
            reports/v18/
            reports/v19/
            reports/v20/
            reports/v21/
            reports/v22/
            reports/v24/
            reports/v25/
          if-no-files-found: warn
          retention-days: 90
