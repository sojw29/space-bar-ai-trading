name: SPACE BAR V178 Meeting Status Metrics
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v178_meeting_status_metrics.py'
      - '.github/workflows/test_v178_meeting_status_metrics.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meeting-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v178_meeting_status_metrics.py' -v
