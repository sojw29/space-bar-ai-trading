name: SPACE BAR V139 News Data Provenance
on:
  push:
    paths:
      - 'agents/news_data_provenance_v139.py'
      - 'agents/test_v139_news_data_provenance.py'
      - '.github/workflows/test_v139_news_data_provenance.yml'
  pull_request:
    paths:
      - 'agents/news_data_provenance_v139.py'
      - 'agents/test_v139_news_data_provenance.py'
      - '.github/workflows/test_v139_news_data_provenance.yml'
  workflow_dispatch:
jobs:
  offline-news-provenance:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v139_news_data_provenance.py' -v
