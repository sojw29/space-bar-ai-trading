name: SPACE BAR V87 Mobile Status Export
on:
  push:
    paths:
      - 'agents/mobile_status_export_v87.py'
      - 'agents/test_v87_mobile_export.py'
      - '.github/workflows/test_v87_mobile_export.yml'
  pull_request:
    paths:
      - 'agents/mobile_status_export_v87.py'
      - 'agents/test_v87_mobile_export.py'
      - '.github/workflows/test_v87_mobile_export.yml'
  workflow_dispatch:
jobs:
  mobile-export:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v87_mobile_export.py' -v
      - name: Offline export smoke test
        shell: python
        run: |
          import json, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "mobile.json"
              run = subprocess.run([sys.executable, "agents/mobile_status_export_v87.py", "--output", str(p)], capture_output=True, text=True)
              assert run.returncode in (0, 1), run.stderr
              data = json.loads(p.read_text(encoding="utf-8"))
              assert data["transport"] == "LOCAL_FILE_ONLY"
              assert data["live_trading_approved"] is False
