name: V154 3D Audit HUD
on:
  pull_request:
    paths:
      - 'web/office_3d.html'
      - 'tests/test_3d_audit_hud_v154.py'
      - '.github/workflows/v154-3d-audit-hud.yml'
  push:
    branches: [main]
    paths:
      - 'web/office_3d.html'
      - 'tests/test_3d_audit_hud_v154.py'
      - '.github/workflows/v154-3d-audit-hud.yml'
  workflow_dispatch:
jobs:
  audit-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_3d_audit_hud_v154.py' -v
