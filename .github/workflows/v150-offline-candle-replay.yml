name: SPACE BAR V150 Offline Candle Replay
on:
  pull_request:
    paths:
      - 'agents/offline_candle_replay_v150.py'
      - 'agents/offline_trade_session_v149.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_candle_replay_v150.py'
      - '.github/workflows/v150-offline-candle-replay.yml'
  push:
    branches: [main]
    paths:
      - 'agents/offline_candle_replay_v150.py'
      - 'agents/offline_trade_session_v149.py'
      - 'agents/offline_paper_execution_v145.py'
      - 'tests/test_offline_candle_replay_v150.py'
      - '.github/workflows/v150-offline-candle-replay.yml'
  workflow_dispatch:
jobs:
  offline-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V145-V150 offline tests
        run: python -m unittest discover -s tests -p 'test_offline_*v1*.py' -v
