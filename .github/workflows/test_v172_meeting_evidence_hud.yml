name: SPACE BAR V172 Meeting Evidence HUD
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v172_meeting_evidence_hud.py'
      - '.github/workflows/test_v172_meeting_evidence_hud.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v172_meeting_evidence_hud.py' -v
