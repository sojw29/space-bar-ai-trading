name: V151 Offline Replay Audit
on:
  pull_request:
    paths:
      - 'agents/offline_replay_audit_v151.py'
      - 'tests/test_offline_replay_audit_v151.py'
      - '.github/workflows/v151-offline-replay-audit.yml'
  push:
    branches: [main]
    paths:
      - 'agents/offline_replay_audit_v151.py'
      - 'tests/test_offline_replay_audit_v151.py'
      - '.github/workflows/v151-offline-replay-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_offline_replay_audit_v151.py' -v
