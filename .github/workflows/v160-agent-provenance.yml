name: V160 Agent Inspector Provenance
on:
  pull_request:
    paths:
      - 'web/office_3d.html'
      - 'tests/test_agent_provenance_v160.py'
      - '.github/workflows/v160-agent-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'web/office_3d.html'
      - 'tests/test_agent_provenance_v160.py'
      - '.github/workflows/v160-agent-provenance.yml'
  workflow_dispatch:
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_agent_provenance_v160.py' -v
