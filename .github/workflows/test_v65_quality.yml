name: SPACE BAR V65 Offline Data Quality
on:
  push:
    paths:
      - 'agents/data_quality_v65.py'
      - 'agents/test_v65_quality.py'
      - '.github/workflows/test_v65_quality.yml'
  pull_request:
    paths:
      - 'agents/data_quality_v65.py'
      - 'agents/test_v65_quality.py'
      - '.github/workflows/test_v65_quality.yml'
  workflow_dispatch:
jobs:
  quality-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v65_quality.py' -v
