name: SPACE BAR V144 Offline News Web Dashboard
on:
  push:
    paths:
      - 'agents/news_intelligence_web_dashboard_v144.py'
      - 'agents/test_v144_news_intelligence_web_dashboard.py'
      - '.github/workflows/test_v144_news_intelligence_web_dashboard.yml'
  pull_request:
    paths:
      - 'agents/news_intelligence_web_dashboard_v144.py'
      - 'agents/test_v144_news_intelligence_web_dashboard.py'
      - '.github/workflows/test_v144_news_intelligence_web_dashboard.yml'
  workflow_dispatch:
jobs:
  offline-news-html:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v144_news_intelligence_web_dashboard.py' -v
