name: SPACE BAR V141 News Research Reproducibility
on:
  push:
    paths:
      - 'agents/news_research_reproducibility_v141.py'
      - 'agents/test_v141_news_research_reproducibility.py'
      - '.github/workflows/test_v141_news_research_reproducibility.yml'
  pull_request:
    paths:
      - 'agents/news_research_reproducibility_v141.py'
      - 'agents/test_v141_news_research_reproducibility.py'
      - '.github/workflows/test_v141_news_research_reproducibility.yml'
  workflow_dispatch:
jobs:
  offline-news-replay:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v141_news_research_reproducibility.py' -v
