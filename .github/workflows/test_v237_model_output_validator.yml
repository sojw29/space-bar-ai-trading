name: SPACE BAR V237 Offline Model Output Validator
on:
  push:
    paths:
      - 'agents/model_output_validator_v237.py'
      - 'agents/test_v237_model_output_validator.py'
      - '.github/workflows/test_v237_model_output_validator.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-output-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v237_model_output_validator.py' -v
