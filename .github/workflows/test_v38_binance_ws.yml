name: SPACE BAR V38 Read-only Binance WebSocket

on:
  push:
    branches:
      - feature/v38-binance-readonly-ws
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q agents
      - name: Mock-only public feed and safety tests
        run: |
          python agents/test_v26_agents.py
          python agents/test_v27_events.py
          python agents/test_v37_stream.py
          python agents/test_v38_binance_ws.py
