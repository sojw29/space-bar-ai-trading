name: SPACE BAR V104 EMA Holdout Pipeline
on:
  push:
    paths:
      - 'agents/ema_holdout_pipeline_v104.py'
      - 'agents/test_v104_ema_holdout_pipeline.py'
      - '.github/workflows/test_v104_ema_holdout_pipeline.yml'
  pull_request:
    paths:
      - 'agents/ema_holdout_pipeline_v104.py'
      - 'agents/test_v104_ema_holdout_pipeline.py'
      - '.github/workflows/test_v104_ema_holdout_pipeline.yml'
  workflow_dispatch:
jobs:
  ema-holdout:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v104_ema_holdout_pipeline.py' -v
