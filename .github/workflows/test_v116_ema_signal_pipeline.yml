name: SPACE BAR V116 EMA Signal Pipeline
on:
  push:
    paths:
      - 'agents/ema_signal_pipeline_v116.py'
      - 'agents/test_v116_ema_signal_pipeline.py'
      - '.github/workflows/test_v116_ema_signal_pipeline.yml'
  pull_request:
    paths:
      - 'agents/ema_signal_pipeline_v116.py'
      - 'agents/test_v116_ema_signal_pipeline.py'
      - '.github/workflows/test_v116_ema_signal_pipeline.yml'
  workflow_dispatch:
jobs:
  ema-signal:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s agents -p 'test_v116_ema_signal_pipeline.py' -v
