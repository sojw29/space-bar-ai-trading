name: SPACE BAR V212 Ex-post Regime Strategy Metrics
on:
  push:
    paths:
      - 'agents/regime_strategy_metrics_v212.py'
      - 'agents/publish_scorecard_v203.py'
      - 'agents/test_v212_regime_strategy_metrics.py'
      - '.github/workflows/test_v212_regime_strategy_metrics.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regime-strategy-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v212_regime_strategy_metrics.py' -v
