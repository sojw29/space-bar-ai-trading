name: SPACE BAR V200 3D Room Offline Scorecard
on:
  push:
    paths:
      - 'web/office_3d.html'
      - 'agents/test_v200_room_scorecard.py'
      - '.github/workflows/test_v200_room_scorecard.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agents -p 'test_v200_room_scorecard.py' -v
